name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    branches: [main]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Deploy → Staging
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login en Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Conectar a AKS
        run: |
          az aks get-credentials \
            --resource-group rg-devops-academia \
            --name aks-devops \
            --admin \
            --overwrite-existing

      - name: Instalar Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Helm deploy en Staging
        run: |
          helm upgrade --install devops-app helm/devops-app \
            --namespace staging \
            --create-namespace \
            --set image.repository=${{ secrets.DOCKERHUB_USERNAME }}/devops-app \
            --set image.tag=${{ github.event.workflow_run.head_sha }} \
            --wait --timeout 5m

      - name: Verificar despliegue
        run: |
          kubectl rollout status deployment/devops-app \
            --namespace staging --timeout=5m
          kubectl get pods -n staging
          kubectl get services -n staging

  deploy-production:
    name: Deploy → Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verificar configuración del ambiente
        run: |
          echo "Ambiente: ${{ vars.APP_ENV }}"
          echo "DB configurada: ${{ secrets.DB_URL != '' && 'SI' || 'NO' }}"

      - name: Simular deploy en Producción
        run: |
          echo "========================================="
          echo "  DEPLOY A PRODUCCIÓN"
          echo "  Versión: ${{ github.event.workflow_run.head_sha }}"
          echo "  Ambiente: ${{ vars.APP_ENV }}"
          echo "  Réplicas: ${{ vars.REPLICA_COUNT }}"
          echo "========================================="
          echo "Deploy simulado en producción"
