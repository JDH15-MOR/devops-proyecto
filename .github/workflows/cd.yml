name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    branches: [main]
    types: [completed]

jobs:
  deploy-staging:
    name: Helm deploy en Staging
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout del commit validado por CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configurar Helm
        uses: azure/setup-helm@v4

      - name: Configurar kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.36.0'

      - name: Configurar kubeconfig de AKS
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Verificar conexión con AKS
        run: kubectl get nodes

      - name: Desplegar aplicación con Helm
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          helm upgrade --install devops-app helm/devops-app \
            --namespace staging \
            --create-namespace \
            --set image.repository="${DOCKERHUB_USERNAME}/devops-app" \
            --set image.tag="${IMAGE_TAG}" \
            --wait \
            --timeout 5m

      - name: Verificar despliegue
        run: |
          kubectl rollout status deployment/devops-app -n staging --timeout=180s
          kubectl get pods -n staging
          helm status devops-app -n staging
