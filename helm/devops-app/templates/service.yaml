apiVersion: v1
kind: Service
metadata:
  name: devops-app-svc
  namespace: {{ .Release.Namespace }}
  labels:
    app: devops-app
    app.kubernetes.io/managed-by: Helm
spec:
  type: {{ .Values.service.type }}
  selector:
    app: devops-app
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 8000
      protocol: TCP
